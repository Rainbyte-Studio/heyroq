name: Frontend Build and Typecheck
on:
  pull_request:
    paths:
      - 'src/**'
      - 'firebase-blueprint.json'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'scripts/redact-public-profile-emails.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vite.config.*'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'firebase-blueprint.json'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - 'scripts/redact-public-profile-emails.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vite.config.*'
      - '.github/workflows/frontend-checks.yml'
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/browser/drop-pin-places.mjs
      - run: node --test tests/publicProfileBlueprint.test.cjs
      - run: node --check scripts/redact-public-profile-emails.mjs
      - run: node --test tests/firestoreDeployTarget.test.cjs
