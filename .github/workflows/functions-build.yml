name: Functions TypeScript Build
on:
  pull_request:
    paths:
      - 'functions/src/**'
      - 'functions/tests/**'
      - 'functions/package.json'
      - '.github/workflows/functions-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions --no-package-lock
      - name: TypeScript build
        run: npm --prefix functions run build
      - name: Progression regression tests
        run: node --test functions/tests/*.test.cjs
