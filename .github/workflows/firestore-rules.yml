name: Firestore Security Rules
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/firestoreCounters.rules.test.mjs'
      - 'scripts/pin-image-transition-rules.mjs'
      - 'firebase-applet-config.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test dependencies
        run: npm ci
      - name: Test rules against local Firestore emulator
        run: |
          npx --yes firebase-tools@14.27.0 emulators:exec --only firestore,storage --project demo-heyroq-counter-rules 'node --test tests/firestoreCounters.rules.test.mjs'
