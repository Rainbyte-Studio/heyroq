name: Firestore Security Rules
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestoreCounters.rules.test.mjs'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test dependencies
        run: |
          npm install --no-save --package-lock=false @firebase/rules-unit-testing
      - name: Test rules against local Firestore emulator
        run: |
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-heyroq-counter-rules 'node --test tests/firestoreCounters.rules.test.mjs'
